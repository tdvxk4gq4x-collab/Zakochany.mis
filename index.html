<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zakochany Miś</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      background: white;
      padding: 40px 50px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      z-index: 2;
    }

    .heart {
      font-size: 80px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 30px;
    }

    .signature {
      margin-top: 20px;
      font-size: 16px;
      color: #ff4d6d;
      opacity: 0.8;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      position: absolute;
      background: #ffd6e0;
      color: #ff4d6d;
      font-size: 14px;
      padding: 6px 12px;
    }

    .gif {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    .gif img {
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      top: -10px;
      animation: fall linear forwards;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <div class="heart">❤️</div>
    <h1>Iwka, będziesz moją walentynką?</h1>

    <button id="yesBtn">tak!</button>
    <button id="noBtn">nie.</button>

    <div class="signature">Twój zakochany Miś 🧸</div>
  </div>

  <div class="gif" id="gif">
    <h1>Wiedziałem! 🥰</h1>
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Zakochany kundel">
    <div class="signature">Na zawsze 💖</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const card = document.getElementById("card");
    const gif = document.getElementById("gif");

    function moveNo() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("touchstart", moveNo);

    yesBtn.addEventListener("click", () => {
      card.style.display = "none";
      gif.style.display = "flex";
      confetti();
    });

    function confetti() {
      for (let i = 0; i < 80; i++) {
        const c = document.createElement("div");
        c.classList.add("confetti");
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = `hsl(${Math.random()*360},100%,70%)`;
        c.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(c);

        setTimeout(() => c.remove(), 4000);
      }
    }
  </script>

</body>
</html>
